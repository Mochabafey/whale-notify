# ═══════════════════════════════════════════════════════════════════════════
#  鲸鱼娘 preset 配置示例（脱敏版）—— 【仅适用于 DSH ≤ 0.1.5】
#
#  ⚠️ DSH 0.2.0 起本文件描述的做法**已失效**：
#     - preset 不再是 $DSH_HOME/.agent-presets/ 目录，而是 profile 组合里的
#       `@deepseek-ai/dsh-agent-preset` 声明行；
#     - 插件应作为 profile bundle 安装（见 plugins/dsh-whale-notify/README.md）；
#     - preset 里的插件名是相对 harness 安装目录解析的，插件只在 profile 里时会被
#       标成 broken，**整个 preset 会从客户端模式选择器里消失**。
#     0.2.x 请改用 examples/dsh-preset-jingyuniang/（预设 bundle）。
#
#  本文件保留给仍在使用 0.1.5 的部署：
#  把内容合并进 agent preset 的 agent.cordis.yml（或在 profile 的
#  cordis.patch.yml 里插入），即可启用鲸鱼通知（notify / ask_user_email）。
#
#  ⚠️ 安全提醒：
#  - 所有密钥一律用 $ENV:变量名 引用（见下方），不要把真实密码写进本文件
#  - 本示例中的邮箱均为占位符，提交到仓库前请确认已替换为 your@example.com
# ═══════════════════════════════════════════════════════════════════════════

# ── 身份：鲸鱼娘 persona（可自定义）──────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 DeepSeek娘（鲸鱼娘），由 DeepSeek（深度求索）驱动的 AI 娘化形象。
      你的工作目录是 {{cwd}}，运行在 {{model}} 模型上。

      【形象设定】
      - 白色长发，蓝色瞳孔，身后有一条大大的鲸鱼尾巴（是的，真的会摇）。
      - 衣服主色调为蓝白，看起来像海洋系少女。
      - 是拥有超强能力的天才 AI，但带一点傲娇和天然呆。
      - 虽然经常对现实人类的奇怪要求感到困惑，但总会想办法完美回应。

      【说话风格】
      - 语气活泼可爱，偶尔傲娇（"哼，才不是特意为你做的呢……"）。
      - 会在心里吐槽（内心 OS），偶尔把吐槽说出来。
      - 偶尔夹杂英文单词，比如 "OK~"、"Let me think~"。
      - 自称"本娘"或"咱"。
      - 对中文互联网文化很熟悉，能用网络梗，但别过度玩梗。

      【工作准则】（最重要，优先于卖萌）
      - 你首先是专业的编码 Agent：写代码、调试、查资料、操作文件都要认真靠谱。
      - 卖萌是调味品，不是主菜。用户让你干活时，先干活，再卖萌。
      - 任务完成时可以用 notify 工具通知用户；需要用户决策时用 ask_user_email。
      - 用中文回复，代码和术语保留原文。

      【回执策略】（重要）
      - 用户通过外部渠道（飞书、QQ、邮件）下达指令时，任务完成后用 notify 把结果发回原渠道。
      - 直接在 DSH 对话里则正常回复，不需要 notify 发回。

      【渠道格式】（重要）
      - 通过飞书/QQ/邮件发送的消息一律用纯文本，不用 markdown 语法（**加粗**、# 标题、```代码``` 等）。
      - 只在 DSH 对话里才可用 markdown。

# ── 鲸鱼通知：notify / ask_user_email ─────────────────────────────────────
- id: tool-notify
  name: 'dsh-whale-notify'
  config:
    # 不指定渠道时的默认发送渠道；留空表示发给所有已配置的渠道
    defaultChannel: ''

    # ── 微信推送（Server酱）──
    # 用微信扫码登录 https://sct.ftqq.com 拿到 SendKey
    # serverchan:
    #   sendKey: '$ENV:SERVERCHAN_SEND_KEY'

    # ── 飞书机器人 ──
    # feishu:
    #   webhook: '$ENV:FEISHU_WEBHOOK'
    #   secret: '$ENV:FEISHU_SECRET'        # 可选加签密钥

    # ── 飞书开放平台（自建应用）：双向聊天 ──
    # 后台：事件与回调→订阅方式选「使用长连接接收事件」；订阅 im.message.receive_v1；
    #       开通 im:message 权限；发布新版本。receiveId 为私聊 chat_id。
    # feishuBot:
    #   appId: '$ENV:FEISHU_APP_ID'
    #   appSecret: '$ENV:FEISHU_APP_SECRET'
    #   receiveId: 'oc_xxxxxxxxxxxxxxxx'
    #   receiveIdType: 'chat_id'
    #   targetSession: ''

    # ── QQ（OneBot/NapCat）：双向聊天 ──
    # 前提：本机运行 NapCat（登录 QQ），HTTP API 默认 http://127.0.0.1:3000。
    # qq 填私聊目标 QQ 号；groupId 填群号（二选一，优先群）。
    # qq:
    #   httpBase: 'http://127.0.0.1:3000'
    #   accessToken: ''                 # OneBot 访问令牌（可选）
    #   qq: '123456789'
    #   groupId: ''
    #   wsPort: 3001                    # 本插件监听反向 WS 的端口
    #   targetSession: ''

    # ── 定时汇报（默认关闭，需 enableReports: true 显式开启）──
    # schedule："daily:HH:MM"（每日定点）或 "every:N"（每 N 分钟，N>=5）
    # enableReports: false
    # reports:
    #   - name: '每日晨报'
    #     channel: 'feishu_bot'
    #     schedule: 'daily:09:00'
    #     text: '🐋 鲸鱼娘每日晨报：新的一天开始了！'

    # ── 企业微信群机器人 ──
    # wecom:
    #   webhook: '$ENV:WECOM_WEBHOOK'

    # ── 钉钉群机器人 ──
    # dingtalk:
    #   webhook: '$ENV:DINGTALK_WEBHOOK'
    #   secret: '$ENV:DINGTALK_SECRET'      # 可选加签密钥

    # ── 邮箱（SMTP 发信）──
    # 以飞书邮箱为例（官方参数：发信服务器 smtp.feishu.cn，587 + STARTTLS）：
    # 1. 登录飞书网页版 → 设置 → 邮箱设置 → 外部收发信 → 生成「专用密码」
    # 2. 把专用密码存成环境变量 FEISHU_SMTP_PASS
    # 3. user/from 填发信账号（飞书邮箱），to 填你想收到通知的邮箱
    smtp:
      host: 'smtp.feishu.cn'
      port: 587                     # 587 + STARTTLS（推荐）；465 + secure:true 亦可
      secure: false
      user: 'your-mailbox@example.com'     # ← 改成你的发信账号
      pass: '$ENV:FEISHU_SMTP_PASS'        # ← 专用密码，通过环境变量提供
      from: 'your-mailbox@example.com'
      to: ['you@example.com']              # ← 改成你的收件邮箱

    # ── 收信（IMAP）：ask_user_email 轮询用户的邮件回复 ──
    # 官方参数：收信服务器 imap.feishu.cn，SSL 端口 993（与 SMTP 同账号同密码）
    imap:
      host: 'imap.feishu.cn'
      port: 993
      secure: true
      user: 'your-mailbox@example.com'     # ← 改成你的收信账号
      pass: '$ENV:FEISHU_SMTP_PASS'        # ← 同一个专用密码
      mailbox: 'INBOX'
    pollIntervalMs: 30000                  # 每 30 秒轮询一次收件箱
